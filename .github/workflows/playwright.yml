name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browser (${{ matrix.browser }})
      run: npx playwright install --with-deps ${{ matrix.browser }}
    - name: Run Playwright tests (${{ matrix.browser }})
      # The 256-case radio-quiz matrix only needs to run in full once (it's
      # testing the site's grading logic, not per-browser rendering) — on
      # non-chromium projects, --grep-invert excludes the @radio-matrix-only
      # tagged cases so they're never collected there, leaving just the
      # representative sample plus every other test at full coverage.
      run: |
        if [ "${{ matrix.browser }}" = "chromium" ]; then
          npx playwright test --project=chromium
        else
          npx playwright test --project=${{ matrix.browser }} --grep-invert "@radio-matrix-only"
        fi
      env:
        PLAYWRIGHT_HTML_REPORT: playwright-report/${{ matrix.browser }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.browser }}
        path: playwright-report/${{ matrix.browser }}/
        retention-days: 30
