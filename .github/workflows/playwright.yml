name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browser (chromium)
      run: npx playwright install --with-deps chromium
    - name: Run Playwright tests (chromium)
      # firefox/webkit dropped from CI: they were consistently flaky/slow on
      # the hosted runner (WebKit especially, ~35-45min with no GPU accel),
      # and the site logic under test doesn't differ per browser engine.
      # chromium alone covers the full 346-test suite.
      run: npx playwright test --project=chromium
      env:
        PLAYWRIGHT_HTML_REPORT: playwright-report/chromium
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-chromium
        path: playwright-report/chromium/
        retention-days: 30
